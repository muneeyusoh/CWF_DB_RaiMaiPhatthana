<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CWF Executive | กองทุนสวัสดิการชุมชน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <style>
    :root { --primary-dark: #0F172A; --primary-main: #2563EB; --bg-color: #F8FAFC; --bottom-nav-height: 70px; }
    body { background-color: var(--bg-color); font-family: 'Prompt', sans-serif; padding-top: 64px; padding-bottom: 90px; }
    .app-header { background: var(--primary-dark); color: white; position: fixed; top: 0; width: 100%; height: 64px; z-index: 1030; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--bottom-nav-height); background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 1030; }
    .nav-item { flex: 1; text-align: center; color: #64748B; font-size: 0.65rem; font-weight: 600; background: none; border: none; }
    .nav-item.active { color: var(--primary-main); }
    .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 4px; }
    .data-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #E2E8F0; }
    #loginGate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-dark); color: white; z-index: 9998; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .form-control-custom { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; width: 100%; text-align: center; }
  </style>
</head>
<body>

<div id="loginGate">
  <div style="width: 90%; max-width: 400px; text-align: center;">
    <h5 class="fw-bold mb-4">CWF Executive Login</h5>
    <input type="email" id="adminEmail" class="form-control-custom" placeholder="อีเมลผู้ดูแลระบบ">
    <input type="password" id="adminPass" class="form-control-custom" placeholder="รหัสผ่าน">
    <button onclick="handleLogin()" class="btn btn-primary w-100 rounded-pill fw-bold py-2">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="app-header" id="appHeader" style="display: none;">
  <div><h5 class="fw-bold mb-0 text-white">CWF Executive</h5><small class="text-info fw-bold" id="adminNameDisplay" style="font-size:0.75rem;"></small></div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display: none;">
  <button class="nav-item active" onclick="switchTab('view-settings', this)"><i class="fa-solid fa-gear"></i> ระบบ</button>
  <button class="nav-item" onclick="switchTab('view-rules', this); loadRulesData();"><i class="fa-solid fa-scale-balanced"></i> ระเบียบ</button>
  <button class="nav-item" onclick="switchTab('view-admins', this); loadAdminsData();"><i class="fa-solid fa-user-shield"></i> แอดมิน</button>
  <button class="nav-item text-danger" onclick="location.reload();"><i class="fa-solid fa-power-off"></i> ออก</button>
</nav>

<div id="mainWorkspace" class="container-fluid pt-3" style="display: none;">
  
  <!-- ⚙️ 1. ตั้งค่าระบบ (ดึงข้อมูลไปใช้ที่ Index อัตโนมัติ) -->
  <div class="tab-pane d-block" id="view-settings">
    <h5 class="fw-bold text-dark mb-3">การตั้งค่าระบบ (Global)</h5>
    <div class="data-card">
      <label class="small fw-bold text-muted">เงินสมทบต่อปี (บาท)</label>
      <input type="number" id="setAnnualFee" class="form-control mb-3" value="365">
      
      <label class="small fw-bold text-muted">หมู่บ้านที่ถือว่าเป็นสมาชิกสามัญ (คั่นด้วยลูกน้ำ ,)</label>
      <textarea id="setInZone" class="form-control mb-3" rows="3" placeholder="หมู่ 1, หมู่ 2"></textarea>
      
      <label class="small fw-bold text-muted">รายชื่อศูนย์ประสานงาน (คั่นด้วยลูกน้ำ ,)</label>
      <textarea id="setCenters" class="form-control mb-3" rows="3"></textarea>

      <button onclick="saveGlobalSettings()" class="btn btn-primary w-100 fw-bold rounded-pill">บันทึกการตั้งค่า</button>
    </div>
  </div>

  <!-- ⚖️ 2. ระเบียบกองทุน -->
  <div class="tab-pane d-none" id="view-rules">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark mb-0">ระเบียบสวัสดิการ</h5>
      <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="openAddRuleModal()">+ เพิ่ม</button>
    </div>
    <div id="list-rules">กำลังโหลด...</div>
  </div>

  <!-- 🛡️ 3. ผู้ดูแลระบบ -->
  <div class="tab-pane d-none" id="view-admins">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark mb-0">ผู้ดูแลระบบ</h5>
      <button class="btn btn-sm btn-primary rounded-pill px-3" id="btnAddAdmin" onclick="openAddAdminModal()" style="display:none;">+ เพิ่ม</button>
    </div>
    <div id="list-admins">กำลังโหลด...</div>
  </div>
</div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI", authDomain: "smartwelf-f7d81.firebaseapp.com", projectId: "smartwelf-f7d81", storageBucket: "smartwelf-f7d81.firebasestorage.app", messagingSenderId: "114126831149", appId: "1:114126831149:web:66ea766f6c558b159442a4" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentAdminData = null;

  document.addEventListener("DOMContentLoaded", async () => { 
    const defaultEmail = "mr.munee@gmail.com";
    const adminRef = db.collection("admins").doc(defaultEmail);
    if (!(await adminRef.get()).exists) {
        await adminRef.set({ email: defaultEmail, password: "8ZOYrtqO", name: "มุนี ยูโซ๊ะ", role: "Admin-Master", status: "ใช้งาน" });
    }
  });

  async function handleLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      try {
          const doc = await db.collection("admins").doc(email).get();
          if (doc.exists && doc.data().password === pass && doc.data().status === 'ใช้งาน') {
              currentAdminData = doc.data();
              document.getElementById('adminNameDisplay').innerText = `${currentAdminData.name} [${currentAdminData.role}]`;
              if(currentAdminData.role === 'Admin-Master') document.getElementById('btnAddAdmin').style.display = 'block';
              
              document.getElementById('loginGate').style.display = 'none';
              document.getElementById('appHeader').style.display = 'flex';
              document.getElementById('bottomNav').style.display = 'flex';
              document.getElementById('mainWorkspace').style.display = 'block';
              
              loadGlobalSettings();
          } else throw new Error();
      } catch (e) { Swal.fire('Error', 'รหัสผ่านไม่ถูกต้อง', 'error'); }
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-pane').forEach(el => { el.classList.remove('d-block'); el.classList.add('d-none'); });
    document.getElementById(tabId).classList.replace('d-none', 'd-block');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); btn.classList.add('active');
  }

  // 🌟 โหลด & บันทึกการตั้งค่าส่วนกลาง
  async function loadGlobalSettings() {
      const snap = await db.collection("settings").doc("master").get();
      if(snap.exists) {
          const d = snap.data();
          if(d.annualFee) document.getElementById('setAnnualFee').value = d.annualFee;
          if(d.inZoneVillages) document.getElementById('setInZone').value = d.inZoneVillages.join(", ");
          if(d.centers) document.getElementById('setCenters').value = d.centers.join(", ");
      }
  }

  async function saveGlobalSettings() {
      if(currentAdminData.role !== 'Admin-Master') return Swal.fire('Error', 'สิทธิ์ไม่เพียงพอ', 'error');
      const inZone = document.getElementById('setInZone').value.split(',').map(s=>s.trim()).filter(s=>s);
      const centers = document.getElementById('setCenters').value.split(',').map(s=>s.trim()).filter(s=>s);
      await db.collection("settings").doc("master").set({
          annualFee: parseFloat(document.getElementById('setAnnualFee').value) || 365,
          inZoneVillages: inZone, centers: centers
      }, {merge: true});
      Swal.fire('สำเร็จ', 'บันทึกการตั้งค่าระบบเรียบร้อย (หน้าเว็บสมาชิกจะดึงค่านี้ไปใช้อัตโนมัติ)', 'success');
  }

  // 🌟 ระเบียบกองทุน
  async function loadRulesData() {
      const snap = await db.collection("rules").get();
      let html = "";
      snap.forEach(doc => {
          const d = doc.data();
          html += `<div class="data-card"><div class="d-flex justify-content-between align-items-center"><h6 class="fw-bold mb-0">${d.name}</h6><button class="btn btn-sm text-danger" onclick="db.collection('rules').doc('${doc.id}').delete().then(loadRulesData)">ลบ</button></div></div>`;
      });
      document.getElementById('list-rules').innerHTML = html || "<p class='text-muted'>ไม่มีระเบียบ</p>";
  }
  
  function openAddRuleModal() {
      Swal.fire({ title: 'เพิ่มสวัสดิการ', html: `<input id="rName" class="form-control mb-2" placeholder="ชื่อสวัสดิการ"><input id="rMax" type="number" class="form-control" placeholder="เบิกสูงสุด/ครั้ง">`, preConfirm: async () => {
          await db.collection("rules").add({ name: document.getElementById('rName').value, maxPerClaim: document.getElementById('rMax').value }); loadRulesData();
      }});
  }

  // 🌟 แอดมิน
  async function loadAdminsData() {
      const snap = await db.collection("admins").get();
      let html = "";
      snap.forEach(doc => {
          const d = doc.data();
          html += `<div class="data-card"><h6 class="fw-bold mb-0">${d.name}</h6><small>${d.email} | ${d.role} | ${d.status}</small></div>`;
      });
      document.getElementById('list-admins').innerHTML = html;
  }
  
  function openAddAdminModal() {
      Swal.fire({ title: 'เพิ่ม Admin', html: `<input id="aEmail" type="email" class="form-control mb-2" placeholder="อีเมล"><input id="aPass" class="form-control mb-2" placeholder="รหัสผ่าน"><input id="aName" class="form-control" placeholder="ชื่อ">`, preConfirm: async () => {
          await db.collection("admins").doc(document.getElementById('aEmail').value).set({ email: document.getElementById('aEmail').value, password: document.getElementById('aPass').value, name: document.getElementById('aName').value, role: "Admin-ศูนย์ประสานงาน", status: "ใช้งาน" }); loadAdminsData();
      }});
  }
</script>
</body>
</html>
