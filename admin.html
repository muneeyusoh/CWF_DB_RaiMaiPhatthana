<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F172A">
  <title>CWF Executive | กองทุนสวัสดิการชุมชน</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- 🚀 โหลด Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <style>
    :root { --bg-color: #F8FAFC; --card-bg: #FFFFFF; --primary-dark: #0F172A; --primary-main: #2563EB; --success-main: #10B981; --warning-main: #F59E0B; --danger-main: #EF4444; --text-main: #1E293B; --border-color: #E2E8F0; --bottom-nav-height: 70px; }
    body { background-color: var(--bg-color); font-family: 'Prompt', sans-serif; color: var(--text-main); padding-top: 64px; padding-bottom: calc(var(--bottom-nav-height) + 20px); }
    
    .app-header { background: var(--primary-dark); color: white; position: fixed; top: 0; left: 0; width: 100%; height: 64px; z-index: 1030; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--bottom-nav-height); background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 1030; border-top: 1px solid var(--border-color); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: #64748B; font-size: 0.7rem; font-weight: 600; background: none; border: none; padding: 5px 0; }
    .nav-item.active { color: var(--primary-main); }
    .nav-item i { font-size: 1.2rem; margin-bottom: 4px; }
    .nav-item.active i { font-size: 1.3rem; }

    .ledger-card-total { background: linear-gradient(135deg, #0F172A 0%, #1e3a8a 100%); border-radius: 1.5rem; padding: 1.5rem; color: white; margin-bottom: 16px; }
    .data-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    
    .tx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; background: #f1f5f9; color: #64748b; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-dark); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<!-- ⏳ Loader -->
<div id="loader"><div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;"></div><h5 class="fw-bold">เชื่อมต่อตู้เซฟข้อมูล...</h5></div>

<div class="app-header">
  <div>
    <h5 class="fw-bold mb-0">CWF Executive</h5>
    <small class="text-info fw-bold" style="font-size: 0.75rem;">ไร่ใหม่พัฒนา</small>
  </div>
  <button onclick="loadDashboardOverview()" class="btn btn-sm btn-outline-light rounded-circle"><i class="fa-solid fa-rotate-right"></i></button>
</div>

<!-- 🚀 Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('view-overview', this); loadDashboardOverview();"><i class="fa-solid fa-chart-pie"></i> ภาพรวม</button>
  <button class="nav-item" onclick="switchTab('view-members', this); loadMembersData();"><i class="fa-solid fa-users"></i> สมาชิก</button>
  <button class="nav-item" onclick="switchTab('view-transactions', this); loadTransactions();"><i class="fa-solid fa-wallet"></i> รอรับเงิน</button>
  <button class="nav-item" onclick="switchTab('view-claims', this); loadClaims();"><i class="fa-solid fa-hand-holding-medical"></i> รอจ่าย</button>
  <button class="nav-item text-danger" onclick="alert('ออกจากระบบสำเร็จ'); window.close();"><i class="fa-solid fa-power-off"></i> ออก</button>
</nav>

<div id="mainWorkspace" class="container-fluid pt-3">
  
  <!-- 📊 1. ภาพรวม -->
  <div class="tab-pane d-block" id="view-overview">
    <div class="ledger-card-total text-center">
      <span class="small text-white-50 fw-bold">สมาชิกในระบบทั้งหมด (คน)</span>
      <h1 class="fw-bold mb-0 mt-2" id="statMembers">0</h1>
    </div>
    <div class="row g-2">
      <div class="col-6">
        <div class="data-card text-center"><h6 class="text-success small fw-bold">ยอดเงินสมทบรวม</h6><h4 class="fw-bold mb-0" id="statContrib">฿0</h4></div>
      </div>
      <div class="col-6">
        <div class="data-card text-center"><h6 class="text-danger small fw-bold">ยอดจ่ายสวัสดิการ</h6><h4 class="fw-bold mb-0" id="statWelfare">฿0</h4></div>
      </div>
    </div>
    
    <div class="data-card text-center mt-3 bg-warning bg-opacity-10 border-warning">
      <h6 class="text-dark fw-bold mb-1">รายการรอตรวจสอบรวม (Pending)</h6>
      <h3 class="text-danger fw-bold mb-0" id="statPendingBadge">0 รายการ</h3>
    </div>
  </div>

  <!-- 👥 2. สมาชิก -->
  <div class="tab-pane d-none" id="view-members">
    <h5 class="fw-bold mb-3">รายชื่อสมาชิกล่าสุด</h5>
    <div id="list-members">กำลังโหลด...</div>
  </div>

  <!-- 💳 3. รอตรวจสอบสมทบ -->
  <div class="tab-pane d-none" id="view-transactions">
    <h5 class="fw-bold mb-3 text-success">ยอดรออนุมัติรับเงิน</h5>
    <div id="list-transactions">กำลังโหลด...</div>
  </div>

  <!-- 🏥 4. รอตรวจสอบขอเบิก -->
  <div class="tab-pane d-none" id="view-claims">
    <h5 class="fw-bold mb-3 text-danger">คำขอเบิกสวัสดิการ</h5>
    <div id="list-claims">กำลังโหลด...</div>
  </div>

</div>

<script>
  // 🔑 ใส่กุญแจ Firebase 
  const firebaseConfig = {
    apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI",
    authDomain: "smartwelf-f7d81.firebaseapp.com",
    projectId: "smartwelf-f7d81",
    storageBucket: "smartwelf-f7d81.firebasestorage.app",
    messagingSenderId: "114126831149",
    appId: "1:114126831149:web:66ea766f6c558b159442a4"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener("DOMContentLoaded", () => { loadDashboardOverview(); });

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-pane').forEach(el => el.classList.replace('d-block', 'd-none'));
    document.getElementById(tabId).classList.replace('d-none', 'd-block');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    window.scrollTo(0,0);
  }

  // 🚀 ดึงข้อมูลภาพรวม (สรุปยอด)
  async function loadDashboardOverview() {
    document.getElementById('loader').style.display = 'flex';
    try {
      let mCount = 0, sumIn = 0, sumOut = 0, pCount = 0;
      
      const mSnap = await db.collection("members").get();
      mCount = mSnap.size;
      mSnap.forEach(d => { sumIn += d.data().totalContribution || 0; sumOut += d.data().totalWelfareReceived || 0; });
      
      const tSnap = await db.collection("transactions").where("status", "==", "รอตรวจสอบ").get();
      pCount += tSnap.size;
      
      const cSnap = await db.collection("claims").where("status", "==", "รอตรวจสอบ").get();
      pCount += cSnap.size;

      document.getElementById('statMembers').innerText = mCount.toLocaleString();
      document.getElementById('statContrib').innerText = "฿" + sumIn.toLocaleString();
      document.getElementById('statWelfare').innerText = "฿" + sumOut.toLocaleString();
      document.getElementById('statPendingBadge').innerText = pCount + " รายการ";

    } catch (e) { console.error(e); }
    document.getElementById('loader').style.display = 'none';
  }

  // 🚀 ดึงรายชื่อสมาชิก
  async function loadMembersData() {
    try {
      const snap = await db.collection("members").orderBy("timestamp", "desc").limit(20).get();
      let html = "";
      snap.forEach(doc => {
        const d = doc.data();
        html += `<div class="data-card"><div class="d-flex justify-content-between">
          <div><h6 class="fw-bold mb-0">${d.fullName}</h6><small class="text-primary">${d.memberId}</small></div>
          <span class="badge bg-success rounded-pill align-self-center">${d.status}</span>
        </div></div>`;
      });
      document.getElementById('list-members').innerHTML = html || "ไม่มีข้อมูล";
    } catch(e) { document.getElementById('list-members').innerHTML = "เกิดข้อผิดพลาด"; }
  }

  // 🚀 ดึงรายการรออนุมัติรับเงิน
  async function loadTransactions() {
    try {
      const snap = await db.collection("transactions").where("status", "==", "รอตรวจสอบ").get();
      let html = "";
      snap.forEach(doc => {
        const d = doc.data();
        html += `<div class="data-card"><div class="d-flex justify-content-between align-items-center">
          <div><h6 class="fw-bold mb-0">${d.fullName}</h6><small class="text-muted">${d.type}</small></div>
          <div class="text-end"><h6 class="fw-bold text-success mb-0">+฿${d.amount}</h6><button onclick="approveTx('${doc.id}')" class="btn btn-sm btn-success rounded-pill mt-1">อนุมัติ</button></div>
        </div></div>`;
      });
      document.getElementById('list-transactions').innerHTML = html || "<p class="text-center text-muted">ไม่มีรายการค้าง</p>";
    } catch(e) { document.getElementById('list-transactions').innerHTML = "เกิดข้อผิดพลาด"; }
  }

  // 🚀 ดึงรายการคำขอเบิกสวัสดิการ
  async function loadClaims() {
    try {
      const snap = await db.collection("claims").where("status", "==", "รอตรวจสอบ").get();
      let html = "";
      snap.forEach(doc => {
        const d = doc.data();
        html += `<div class="data-card"><div class="d-flex justify-content-between align-items-center">
          <div><h6 class="fw-bold mb-0">${d.fullName}</h6><small class="text-primary">${d.welfareType}</small></div>
          <div class="text-end"><h6 class="fw-bold text-danger mb-0">-฿${d.claimAmount}</h6><button onclick="approveClaim('${doc.id}')" class="btn btn-sm btn-primary rounded-pill mt-1">จัดการ</button></div>
        </div></div>`;
      });
      document.getElementById('list-claims').innerHTML = html || "<p class="text-center text-muted">ไม่มีคำขอค้าง</p>";
    } catch(e) { document.getElementById('list-claims').innerHTML = "เกิดข้อผิดพลาด"; }
  }

  // 🔴 ฟังก์ชันจำลองการกดอนุมัติ (อัปเดตสถานะใน Firestore)
  async function approveTx(id) {
    if(confirm("ยืนยันการรับเงิน?")) {
      await db.collection("transactions").doc(id).update({status: "อนุมัติแล้ว"});
      loadTransactions(); loadDashboardOverview();
    }
  }
  async function approveClaim(id) {
    if(confirm("ยืนยันการจ่ายเงินสวัสดิการ?")) {
      await db.collection("claims").doc(id).update({status: "อนุมัติแล้ว"});
      loadClaims(); loadDashboardOverview();
    }
  }
</script>
</body>
</html>
