<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ขอรับสวัสดิการ | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    :root { --fintech-primary: #0F172A; --fintech-accent: #2563EB; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; padding-bottom: 40px; }
    .app-header { background: var(--fintech-primary); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 24px 24px; }
    .card-box { background: white; padding: 25px 20px; border-radius: 24px; margin: -20px auto 20px; position: relative; border: 1px solid #E5E7EB; }
    .welfare-card { border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 4px solid var(--fintech-accent); }
    .form-control, .form-select { border-radius: 12px; padding: 14px; border: 1px solid #CBD5E1; }
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; width: 100%; border: none; }
    .doc-upload-box { border: 2px dashed #CBD5E1; border-radius: 16px; padding: 20px; text-align: center; background: #F8FAFC; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-header" id="headerSection">
  <h4 class="fw-bold mb-1">ขอรับสวัสดิการ</h4>
</div>

<div class="container px-3">
  <div id="welfareListSection" class="card-box">
    <h6 class="fw-bold text-dark mb-3">เลือกประเภทสวัสดิการ</h6>
    <div id="welfareList">กำลังโหลด...</div>
  </div>

  <div id="claimFormSection" class="card-box" style="display:none;">
    <div class="d-flex align-items-center mb-4 border-bottom pb-3">
      <button onclick="goBack()" class="btn btn-light rounded-circle me-3"><i class="fa-solid fa-arrow-left"></i></button>
      <div><h5 class="fw-bold mb-0 text-dark" id="titleWelfare"></h5><small class="text-primary fw-bold" id="claimMaxBadge"></small></div>
    </div>

    <form onsubmit="submitClaim(event)">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName"> 
      <input type="hidden" id="welfareName" name="welfareName">
      
      <div class="mb-3"><input type="number" id="claimAmount" name="claimAmount" class="form-control text-primary fs-5" placeholder="ระบุจำนวนเงิน (บาท)" required></div>
      
      <!-- 🌟 ส่วนที่เพิ่มสำหรับ "เจ็บป่วย" -->
      <div id="sicknessSection" style="display: none;">
          <div class="mb-3">
              <select name="diseaseCategory" id="diseaseCategory" class="form-select">
                  <option value="" disabled selected>-- เลือกกลุ่มโรค --</option>
                  <option>โรคระบบทางเดินหายใจ (เช่น ไข้หวัดใหญ่, โควิด, หอบหืด)</option>
                  <option>โรคระบบทางเดินอาหาร (เช่น ท้องร่วง, อาหารเป็นพิษ)</option>
                  <option>โรคไข้เลือดออก / ไข้มาลาเรีย</option>
                  <option>โรคไม่ติดต่อเรื้อรัง (NCDs) (เบาหวาน, ความดัน, หัวใจ)</option>
                  <option>อุบัติเหตุ / การบาดเจ็บ</option>
                  <option>โรคอื่นๆ</option>
              </select>
          </div>
          <div class="mb-3"><input type="text" name="hospitalName" id="hospitalName" class="form-control" placeholder="ระบุชื่อโรงพยาบาล/คลินิก"></div>
      </div>

      <div class="mb-4">
        <label class="small text-muted fw-bold mb-2" id="docRequirement">แนบเอกสาร</label>
        <div class="doc-upload-box" onclick="document.getElementById('docInput').click()">
          <i class="fa-solid fa-cloud-arrow-up text-primary fs-2 mb-2"></i>
          <h6 class="fw-bold text-dark mb-1">แตะเพื่อเลือกรูปภาพ</h6>
          <small id="fileNameDisplay">รองรับไฟล์ JPG, PNG</small>
        </div>
        <input type="file" id="docInput" class="d-none" accept="image/*" required onchange="convertImg(this)">
        <input type="hidden" id="docBase64" name="docBase64">
      </div>
      
      <button type="submit" class="btn btn-fintech" id="submitBtn">ยื่นเอกสาร</button>
    </form>
  </div>
</div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI", authDomain: "smartwelf-f7d81.firebaseapp.com", projectId: "smartwelf-f7d81", storageBucket: "smartwelf-f7d81.firebasestorage.app", messagingSenderId: "114126831149", appId: "1:114126831149:web:66ea766f6c558b159442a4" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: "2011183541-uvW1j86T" });
    if(liff.isLoggedIn()) {
      const profile = await liff.getProfile(); document.getElementById('uid').value = profile.userId;
      const docSnap = await db.collection("members").doc(profile.userId).get();
      if(docSnap.exists) {
        document.getElementById('fullName').value = docSnap.data().fullName; 
        
        // 🌟 ดึงข้อมูลระเบียบจาก Firestore (ถ้ามี) ถ้าไม่มีใช้ค่าพื้นฐาน
        const rulesSnap = await db.collection("rules").get();
        let listHtml = "";
        rulesSnap.forEach(r => {
           const d = r.data();
           listHtml += `<div class="welfare-card eligible" onclick="openForm('${d.name}', ${d.maxPerClaim}, 'เอกสารประกอบ')">
              <div><h6 class="mb-0 fw-bold">${d.name}</h6><small class="text-primary">สูงสุด ${d.maxPerClaim} ฿</small></div>
              <i class="fa-solid fa-chevron-right text-muted"></i>
           </div>`;
        });
        
        if(!listHtml) {
            // ค่าพื้นฐาน
            listHtml = `<div class="welfare-card eligible" onclick="openForm('สวัสดิการเจ็บป่วย (นอน รพ.)', 1000, 'ใบรับรองแพทย์และใบเสร็จ')"><div><h6 class="mb-0 fw-bold">สวัสดิการเจ็บป่วย</h6><small class="text-primary">สูงสุด 1000 ฿</small></div></div>`;
            listHtml += `<div class="welfare-card eligible" onclick="openForm('สวัสดิการเสียชีวิต', 10000, 'ใบมรณบัตร')"><div><h6 class="mb-0 fw-bold">สวัสดิการเสียชีวิต</h6><small class="text-primary">สูงสุด 10000 ฿</small></div></div>`;
        }
        document.getElementById('welfareList').innerHTML = listHtml;
      }
    } else liff.login();
  });

  function openForm(name, max, docs) {
    document.getElementById('welfareListSection').style.display='none'; 
    document.getElementById('claimFormSection').style.display='block';
    document.getElementById('titleWelfare').innerText = name; 
    document.getElementById('welfareName').value = name;
    document.getElementById('claimMaxBadge').innerText = `เบิกได้สูงสุด ${max} ฿`;
    document.getElementById('claimAmount').max = max;

    // 🌟 แสดงตัวเลือกกลุ่มโรค ถ้าเป็นสวัสดิการเจ็บป่วย
    if(name.includes('เจ็บป่วย') || name.includes('รพ')) {
        document.getElementById('sicknessSection').style.display = 'block';
        document.getElementById('diseaseCategory').required = true;
        document.getElementById('hospitalName').required = true;
    } else {
        document.getElementById('sicknessSection').style.display = 'none';
        document.getElementById('diseaseCategory').required = false;
        document.getElementById('hospitalName').required = false;
    }
  }
  
  function goBack() { document.getElementById('welfareListSection').style.display='block'; document.getElementById('claimFormSection').style.display='none'; }

  function convertImg(input) { 
    const f = input.files[0]; if (!f) return;
    document.getElementById('fileNameDisplay').innerText = f.name;
    const reader = new FileReader(); reader.onload = function(e) {
      const img = new Image(); img.onload = function() {
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
        document.getElementById('docBase64').value = canvas.toDataURL('image/webp', 0.5);
      }; img.src = e.target.result;
    }; reader.readAsDataURL(f); 
  }
  
  async function submitClaim(e) {
    e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true; 
    const formDataObj = Object.fromEntries(new FormData(e.target));
    const d = new Date(); const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`;
    
    const claimData = {
        uid: formDataObj.uid, fullName: formDataObj.fullName, welfareType: formDataObj.welfareName,
        claimAmount: parseFloat(formDataObj.claimAmount), docBase64: formDataObj.docBase64,
        disease: formDataObj.diseaseCategory || null, hospital: formDataObj.hospitalName || null,
        status: "รอตรวจสอบ", dateStr: dateStr, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("claims").add(claimData);
      Swal.fire({ title: 'สำเร็จ', text: 'ส่งคำขอเบิกสวัสดิการเรียบร้อย', icon: 'success' }).then(()=>liff.closeWindow());
    } catch(err) { btn.disabled = false; }
  }
</script>
</body>
</html>
