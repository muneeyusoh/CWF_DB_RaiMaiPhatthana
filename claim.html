<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ขอรับสวัสดิการ | SmartWelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    :root { --fintech-primary: #0F172A; --fintech-accent: #2563EB; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; padding-bottom: 40px; }
    
    .app-header { background: var(--fintech-primary); color: white; padding: 40px 20px 60px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card-box { background: white; padding: 25px 20px; border-radius: 24px; margin: -40px auto 20px; position: relative; border: 1px solid #E5E7EB; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    
    .welfare-card { border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 5px solid var(--fintech-accent); transition: 0.2s; background: white; }
    .welfare-card:active { transform: scale(0.98); background: #F1F5F9; }
    
    .form-control, .form-select { border-radius: 12px; padding: 14px; border: 1px solid #CBD5E1; font-weight: 500; background: #F8FAFC; }
    .form-control:focus, .form-select:focus { border-color: var(--fintech-accent); background: white; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.3); transition: 0.3s; }
    .btn-fintech:disabled { background-color: #94A3B8; box-shadow: none; }
    
    .doc-upload-box { border: 2px dashed #93C5FD; border-radius: 16px; padding: 30px 20px; text-align: center; background: #EFF6FF; cursor: pointer; transition: 0.3s; }
    .doc-upload-box:active { background: #DBEAFE; }
    
    #systemLoading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

<div id="systemLoading">
    <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
    <h6 class="text-muted fw-bold">ตรวจสอบข้อมูลสิทธิ...</h6>
</div>

<div class="app-header" id="headerSection">
  <div class="d-flex align-items-center justify-content-center mb-2">
    <h4 class="fw-bold mb-0">ขอรับสวัสดิการ</h4>
  </div>
  <p class="text-white-50 small mb-0">ส่งเอกสารออนไลน์ รวดเร็ว ไม่ต้องเดินทาง</p>
</div>

<div class="container px-3">
  
  <!-- หน้า 1: เลือกสวัสดิการ -->
  <div id="welfareListSection" class="card-box">
    <h6 class="fw-bold text-dark mb-1"><i class="fa-solid fa-list-check text-primary me-2"></i>เลือกประเภทสวัสดิการ</h6>
    <p class="small text-muted mb-3 border-bottom pb-2">สวัสดิการที่คุณมีสิทธิเบิกได้ตามระเบียบกองทุน</p>
    <div id="welfareList"></div>
  </div>

  <!-- หน้า 2: กรอกแบบฟอร์ม -->
  <div id="claimFormSection" class="card-box" style="display:none;">
    <div class="d-flex align-items-start mb-4 border-bottom pb-3">
      <button onclick="goBack()" class="btn btn-light rounded-circle me-3 border"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
          <h5 class="fw-bold mb-1 text-dark" id="titleWelfare"></h5>
          <span class="badge bg-primary bg-opacity-10 text-primary" id="claimMaxBadge"></span>
      </div>
    </div>

    <form onsubmit="submitClaim(event)">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName"> 
      <input type="hidden" id="welfareName" name="welfareName">
      
      <div class="mb-4">
          <label class="small text-muted fw-bold mb-1">จำนวนเงินที่ต้องการขอเบิก (บาท)</label>
          <input type="number" id="claimAmount" name="claimAmount" class="form-control text-primary fs-3 fw-bold text-center" placeholder="0.00" required>
      </div>
      
      <!-- 🌟 ส่วนที่เพิ่มสำหรับ "เจ็บป่วย" -->
      <div id="sicknessSection" class="p-3 bg-light rounded-4 mb-4 border" style="display: none;">
          <label class="small text-dark fw-bold mb-2"><i class="fa-solid fa-notes-medical text-danger me-1"></i> ข้อมูลการรักษาพยาบาล</label>
          <div class="mb-3">
              <select name="diseaseCategory" id="diseaseCategory" class="form-select bg-white">
                  <option value="" disabled selected>-- เลือกกลุ่มโรค/อาการ --</option>
                  <option>โรคระบบทางเดินหายใจ (ไข้หวัด, โควิด, หอบหืด)</option>
                  <option>โรคระบบทางเดินอาหาร (ท้องร่วง, อาหารเป็นพิษ)</option>
                  <option>โรคไข้เลือดออก / ไข้มาลาเรีย</option>
                  <option>โรคไม่ติดต่อเรื้อรัง (NCDs) (เบาหวาน, ความดัน, หัวใจ)</option>
                  <option>อุบัติเหตุ / การบาดเจ็บ</option>
                  <option>โรคอื่นๆ</option>
              </select>
          </div>
          <div class="mb-0">
              <input type="text" name="hospitalName" id="hospitalName" class="form-control bg-white" placeholder="ระบุชื่อโรงพยาบาล/คลินิก">
          </div>
      </div>

      <div class="mb-4">
        <label class="small text-dark fw-bold mb-2" id="docRequirement"><i class="fa-solid fa-paperclip text-muted me-1"></i> แนบเอกสารหลักฐาน (ใบเสร็จ/ใบรับรองแพทย์)</label>
        <div class="doc-upload-box" onclick="document.getElementById('docInput').click()">
          <i class="fa-solid fa-camera text-primary fs-1 mb-2 d-block"></i>
          <h6 class="fw-bold text-primary mb-1">แตะเพื่อถ่ายรูป / เลือกรูปภาพ</h6>
          <small class="text-muted" id="fileNameDisplay">ระบบจะปรับขนาดไฟล์ให้อัตโนมัติ</small>
        </div>
        <input type="file" id="docInput" class="d-none" accept="image/*" required onchange="convertImg(this)">
        <input type="hidden" id="docBase64" name="docBase64">
      </div>
      
      <button type="submit" class="btn btn-fintech" id="submitBtn">ยืนยันส่งคำขอตรวจสอบ</button>
    </form>
  </div>
</div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI", authDomain: "smartwelf-f7d81.firebaseapp.com", projectId: "smartwelf-f7d81", storageBucket: "smartwelf-f7d81.firebasestorage.app", messagingSenderId: "114126831149", appId: "1:114126831149:web:66ea766f6c558b159442a4" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener("DOMContentLoaded", async () => {
    try {
        await liff.init({ liffId: "2011183541-uvW1j86T" }); // ⚠️ เช็ค LIFF ID ให้ถูกต้อง
        if(liff.isLoggedIn()) {
          const profile = await liff.getProfile(); 
          document.getElementById('uid').value = profile.userId;
          const docSnap = await db.collection("members").doc(profile.userId).get();
          
          if(docSnap.exists) {
            document.getElementById('fullName').value = docSnap.data().fullName; 
            
            // 🌟 ดึงข้อมูลระเบียบจาก Firestore (ตาราง rules ที่แอดมินตั้งค่าไว้)
            const rulesSnap = await db.collection("rules").get();
            let listHtml = "";
            rulesSnap.forEach(r => {
               const d = r.data();
               listHtml += `<div class="welfare-card eligible" onclick="openForm('${d.name}', ${d.maxPerClaim})">
                  <div>
                      <h6 class="mb-1 fw-bold text-dark">${d.name}</h6>
                      <small class="text-primary fw-bold bg-primary bg-opacity-10 px-2 py-1 rounded-pill">สูงสุด ${parseFloat(d.maxPerClaim).toLocaleString()} ฿</small>
                  </div>
                  <div class="icon-box bg-light rounded-circle text-muted" style="width:30px; height:30px;"><i class="fa-solid fa-chevron-right"></i></div>
               </div>`;
            });
            
            // ถ้ายังไม่มีการตั้งกฎในระบบ ให้โชว์ค่า Default
            if(!listHtml) {
                listHtml = `
                <div class="welfare-card eligible" onclick="openForm('สวัสดิการเจ็บป่วย (นอน รพ.)', 1000)">
                    <div><h6 class="mb-1 fw-bold text-dark">สวัสดิการเจ็บป่วย</h6><small class="text-primary fw-bold bg-primary bg-opacity-10 px-2 py-1 rounded-pill">สูงสุด 1,000 ฿</small></div>
                    <div class="icon-box bg-light rounded-circle text-muted" style="width:30px; height:30px;"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
                <div class="welfare-card eligible" onclick="openForm('สวัสดิการเสียชีวิต', 10000)">
                    <div><h6 class="mb-1 fw-bold text-dark">สวัสดิการเสียชีวิต</h6><small class="text-primary fw-bold bg-primary bg-opacity-10 px-2 py-1 rounded-pill">สูงสุด 10,000 ฿</small></div>
                    <div class="icon-box bg-light rounded-circle text-muted" style="width:30px; height:30px;"><i class="fa-solid fa-chevron-right"></i></div>
                </div>`;
            }
            document.getElementById('welfareList').innerHTML = listHtml;
            document.getElementById('systemLoading').style.display = 'none';
          } else {
              Swal.fire('ข้อผิดพลาด', 'ไม่พบประวัติสมาชิก กรุณาลงทะเบียนก่อน', 'error').then(()=>liff.closeWindow());
          }
        } else { liff.login(); }
    } catch(e) {
        document.getElementById('systemLoading').innerHTML = `<h6 class="text-danger">Error: ${e.message}</h6>`;
    }
  });

  function openForm(name, max) {
    document.getElementById('welfareListSection').style.display='none'; 
    document.getElementById('claimFormSection').style.display='block';
    
    document.getElementById('titleWelfare').innerText = name; 
    document.getElementById('welfareName').value = name;
    document.getElementById('claimMaxBadge').innerHTML = `<i class="fa-solid fa-circle-info"></i> เบิกได้สูงสุด ${parseFloat(max).toLocaleString()} บาท`;
    document.getElementById('claimAmount').max = max;

    // 🌟 แสดงตัวเลือกกลุ่มโรค ถ้าเป็นสวัสดิการเจ็บป่วย (UX Automation)
    if(name.includes('เจ็บป่วย') || name.includes('รพ') || name.includes('รักษา')) {
        document.getElementById('sicknessSection').style.display = 'block';
        document.getElementById('diseaseCategory').required = true;
        document.getElementById('hospitalName').required = true;
    } else {
        document.getElementById('sicknessSection').style.display = 'none';
        document.getElementById('diseaseCategory').required = false;
        document.getElementById('hospitalName').required = false;
    }
    window.scrollTo(0,0);
  }
  
  function goBack() { 
      document.getElementById('welfareListSection').style.display='block'; 
      document.getElementById('claimFormSection').style.display='none'; 
  }

  function convertImg(input) { 
    const f = input.files[0]; if (!f) return;
    document.getElementById('fileNameDisplay').innerHTML = `<span class="text-success fw-bold"><i class="fa-solid fa-check-circle"></i> เลือกไฟล์แล้ว: ${f.name}</span>`;
    const reader = new FileReader(); reader.onload = function(e) {
      const img = new Image(); img.onload = function() {
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        // บีบอัดรูปภาพให้ขนาดเล็กลง เพื่อประหยัดพื้นที่ Cloud
        const MAX_WIDTH = 1000; const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        document.getElementById('docBase64').value = canvas.toDataURL('image/jpeg', 0.6);
      }; img.src = e.target.result;
    }; reader.readAsDataURL(f); 
  }
  
  async function submitClaim(e) {
    e.preventDefault(); 
    const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> กำลังส่งเอกสาร...';
    
    const formDataObj = Object.fromEntries(new FormData(e.target));
    const d = new Date(); const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
    
    // 🌟 โครงสร้างข้อมูลที่เชื่อมกับหน้า Admin (Claims) ได้ 100%
    const claimData = {
        uid: formDataObj.uid, 
        fullName: formDataObj.fullName, 
        claimType: formDataObj.welfareName, // แมปชื่อให้ตรงกับที่แอดมินใช้เรียก
        claimAmount: parseFloat(formDataObj.claimAmount), 
        evidenceUrl: formDataObj.docBase64, // แมปชื่อรูปให้ตรงกับที่แอดมินใช้เรียก (แอดมินใช้ evidenceUrl)
        disease: formDataObj.diseaseCategory || null, 
        hospital: formDataObj.hospitalName || null,
        status: "รอตรวจสอบ", 
        dateStr: dateStr, 
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("claims").add(claimData);
      Swal.fire({ title: 'ส่งเอกสารสำเร็จ', text: 'คณะกรรมการจะตรวจสอบเอกสารและแจ้งผลให้ทราบ', icon: 'success', confirmButtonColor: '#2563EB' }).then(()=>liff.closeWindow());
    } catch(err) { 
        btn.disabled = false; btn.innerHTML = 'ยืนยันส่งคำขอตรวจสอบ'; 
        Swal.fire('Error', 'เกิดข้อผิดพลาดในการส่งข้อมูล', 'error');
    }
  }
</script>
</body>
</html>
