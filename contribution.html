<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมทบเงินกองทุน | SmartWelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <style>
    :root { --fintech-primary: #0F172A; --fintech-accent: #2563EB; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; padding-bottom: 40px; }
    
    .app-header { background: linear-gradient(135deg, var(--fintech-primary) 0%, #1e3a8a 100%); color: white; padding: 40px 20px 60px; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card-box { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: -40px auto 20px; position: relative; z-index: 2;}
    
    .wallet-status { background: linear-gradient(135deg, #10B981, #059669); border-radius: 20px; padding: 20px; color: white; margin-bottom: 20px; box-shadow: 0 8px 15px rgba(16, 185, 129, 0.2); }
    
    .payment-option { border: 2px solid #E2E8F0; border-radius: 16px; padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; transition: 0.2s; }
    .payment-option:active { transform: scale(0.98); }
    .payment-option.active { border-color: var(--fintech-accent); background-color: #EFF6FF; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1); }
    .form-check-input { display: none; }
    
    .form-control, .form-select { border-radius: 12px; padding: 14px; font-weight: 500; border: 1px solid #CBD5E1; background-color: #F8FAFC; }
    .form-control:focus, .form-select:focus { border-color: var(--fintech-accent); background-color: white; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    
    .btn-fintech { background-color: var(--fintech-accent); color: white; border-radius: 14px; padding: 16px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: 0.3s; }
    .btn-fintech:disabled { background-color: #94A3B8; box-shadow: none; }
    
    #systemLoading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

<div id="systemLoading">
    <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
    <h6 class="text-muted fw-bold">กำลังเตรียมข้อมูล...</h6>
</div>

<div class="app-header">
  <div class="d-flex align-items-center mb-2">
    <button onclick="liff.closeWindow()" class="btn btn-sm text-white px-0 border-0 fs-4"><i class="fa-solid fa-arrow-left"></i></button>
    <h4 class="fw-bold mb-0 ms-3">สมทบเงินกองทุน</h4>
  </div>
  <p class="text-white-50 small text-start ms-4 ps-2 mb-0">ชำระเงินประจำเดือน / ชำระย้อนหลัง</p>
</div>

<div class="container px-3 mb-5">
  <div class="card-box">
    
    <!-- Status Card -->
    <div class="wallet-status">
      <div class="d-flex justify-content-between align-items-end mb-2">
        <div>
          <small class="opacity-75 fw-bold d-block">ยอดสมทบสะสมทั้งหมด</small>
          <h2 class="fw-bold mb-0">฿<span id="dashTotalContrib">0.00</span></h2>
        </div>
        <div class="text-end">
          <small class="opacity-75 fw-bold d-block">สถานะ</small>
          <span class="badge bg-white text-success rounded-pill px-2 shadow-sm" id="statusBadge">ปกติ</span>
        </div>
      </div>
      <div class="progress mt-3 bg-white bg-opacity-25" style="height: 8px;">
        <div class="progress-bar bg-white" id="progressBar" style="width: 0%;"></div>
      </div>
      <div class="d-flex justify-content-between mt-2 small fw-bold">
        <span>ค้างชำระ: <span id="debtText" class="text-warning">0</span> ฿</span>
        <span>เป้าหมายปีนี้: <span id="annualFeeText">365</span> ฿</span>
      </div>
    </div>

    <!-- Payment Form -->
    <form id="contribForm" onsubmit="submitContrib(event)">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName">
      <input type="hidden" id="memberCenter" name="center">
      
      <div class="mb-4">
          <label class="small text-muted fw-bold mb-1">ระบุจำนวนเงินที่ต้องการชำระ (บาท)</label>
          <input type="number" id="amount" name="amount" class="form-control text-primary fw-bold fs-3 text-center" placeholder="0.00" step="0.01" required>
      </div>
      
      <label class="small text-muted fw-bold mb-2">เลือกช่องทางการชำระเงิน</label>
      <label class="payment-option active" id="lblTransfer">
        <input class="form-check-input" type="radio" name="paymentType" value="transfer" onchange="togglePaymentSection()" checked required>
        <div class="icon-box bg-primary bg-opacity-10 text-primary rounded-circle" style="width:40px; height:40px;"><i class="fa-solid fa-money-bill-transfer"></i></div>
        <div class="fw-bold text-dark flex-grow-1">โอนเงินเข้าบัญชีกองทุน<small class="d-block text-muted fw-normal">แนบสลิปโอนเงิน</small></div>
        <i class="fa-solid fa-circle-check text-primary fs-5 check-icon"></i>
      </label>

      <label class="payment-option" id="lblCash">
        <input class="form-check-input" type="radio" name="paymentType" value="cash" onchange="togglePaymentSection()">
        <div class="icon-box bg-warning bg-opacity-10 text-warning rounded-circle" style="width:40px; height:40px;"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <div class="fw-bold text-dark flex-grow-1">ฝากเงินสดผ่านกรรมการ<small class="d-block text-muted fw-normal">เลือกกรรมการผู้รับเงิน</small></div>
        <i class="fa-solid fa-circle-check text-muted fs-5 check-icon opacity-25"></i>
      </label>
      
      <!-- Upload Slip Section -->
      <div id="transferSection" class="mb-4 p-3 bg-light rounded-4 border border-primary border-opacity-25">
        <label class="small text-dark fw-bold mb-2"><i class="fa-solid fa-cloud-arrow-up text-primary me-1"></i> อัปโหลดสลิปโอนเงิน</label>
        <input type="file" class="form-control bg-white" id="slipFile" accept="image/*" onchange="convertImg(this)">
        <input type="hidden" id="slipBase64" name="slipBase64">
        <small class="text-danger mt-1 d-block" id="slipError" style="display:none;"><i class="fa-solid fa-circle-exclamation"></i> กรุณาแนบสลิป</small>
      </div>

      <!-- Select Admin Section -->
      <div id="cashSection" style="display:none;" class="mb-4 p-3 bg-light rounded-4 border border-warning border-opacity-25">
        <label class="small text-dark fw-bold mb-2"><i class="fa-solid fa-user-tie text-warning me-1"></i> มอบเงินสดให้กรรมการท่านใด?</label>
        <select class="form-select bg-white fw-bold text-primary" id="committeeSelect" name="committeeName">
            <option value="ไม่ระบุ">-- กำลังโหลดรายชื่อกรรมการ --</option>
        </select>
      </div>
      
      <button type="submit" class="btn btn-fintech" id="submitBtn">ยืนยันทำรายการ</button>
    </form>
  </div>
</div>

<script>
  // การตั้งค่า Firebase (กรุณาใช้ Config ของคุณ)
  const firebaseConfig = { apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI", authDomain: "smartwelf-f7d81.firebaseapp.com", projectId: "smartwelf-f7d81", storageBucket: "smartwelf-f7d81.firebasestorage.app", messagingSenderId: "114126831149", appId: "1:114126831149:web:66ea766f6c558b159442a4" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  let annualFee = 365;

  document.addEventListener("DOMContentLoaded", async () => {
    try {
        await liff.init({ liffId: "2011183541-lPBacDBx" }); // ⚠️ เช็ค LIFF ID ให้ถูกต้อง
        if(liff.isLoggedIn()) {
          const profile = await liff.getProfile(); 
          document.getElementById('uid').value = profile.userId;
          
          // ดึงค่า Global Settings
          const sysSnap = await db.collection("settings").doc("master").get();
          if(sysSnap.exists) {
              annualFee = sysSnap.data().annualFee || 365;
              document.getElementById('annualFeeText').innerText = annualFee.toLocaleString();
          }

          // ดึงข้อมูลสมาชิก
          const docRef = db.collection("members").doc(profile.userId);
          const docSnap = await docRef.get();
          
          if (docSnap.exists) {
              const d = docSnap.data();
              document.getElementById('fullName').value = d.fullName;
              document.getElementById('memberCenter').value = d.center || "ไม่ระบุศูนย์";
              
              const total = d.totalContribution || 0;
              document.getElementById('dashTotalContrib').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2});
              
              let debt = (d.outstandingBalance !== undefined) ? d.outstandingBalance : (annualFee - total);
              if (debt < 0) debt = 0;
              
              document.getElementById('debtText').innerText = debt.toLocaleString('en-US', {minimumFractionDigits: 2});
              
              // คำนวณ Progress Bar
              let percent = (total / annualFee) * 100;
              if (percent > 100) percent = 100;
              document.getElementById('progressBar').style.width = percent + "%";
              
              if (debt > 0) {
                  document.getElementById('statusBadge').innerText = "ค้างชำระ";
                  document.getElementById('statusBadge').classList.replace('text-success', 'text-warning');
              }

              // โหลดรายชื่อแอดมิน(กรรมการ) มาใส่ใน Dropdown เงินสด
              const adminSnap = await db.collection("admins").where("status", "==", "ใช้งาน").get();
              const select = document.getElementById('committeeSelect');
              select.innerHTML = '<option value="" disabled selected>-- เลือกกรรมการผู้รับเงิน --</option>';
              
              // ดันชื่อกรรมการประจำสายของตัวเองขึ้นมาก่อน
              if(d.responsibleAdmin && d.responsibleAdmin !== "ไม่มีผู้ดูแล") {
                  select.innerHTML += `<option value="${d.responsibleAdmin}">⭐ ${d.responsibleAdmin} (กรรมการประจำสาย)</option>`;
              }
              adminSnap.forEach(a => { 
                  if(a.data().name !== d.responsibleAdmin) {
                      select.innerHTML += `<option value="${a.data().name}">${a.data().name}</option>`; 
                  }
              });

              document.getElementById('systemLoading').style.display = 'none';
          } else {
              Swal.fire('ข้อผิดพลาด', 'ไม่พบข้อมูลสมาชิก กรุณาลงทะเบียนก่อน', 'error').then(()=> liff.closeWindow());
          }
        } else { liff.login(); }
    } catch(e) {
        document.getElementById('systemLoading').innerHTML = `<h6 class="text-danger">Error: ${e.message}</h6>`;
    }
  });

  function togglePaymentSection() {
    const pType = document.querySelector('input[name="paymentType"]:checked').value;
    const lblT = document.getElementById('lblTransfer'); const lblC = document.getElementById('lblCash');
    
    lblT.classList.remove('active'); lblC.classList.remove('active');
    lblT.querySelector('.check-icon').classList.replace('text-primary', 'text-muted');
    lblT.querySelector('.check-icon').classList.add('opacity-25');
    lblC.querySelector('.check-icon').classList.replace('text-primary', 'text-muted');
    lblC.querySelector('.check-icon').classList.add('opacity-25');

    if (pType === 'transfer') { 
        lblT.classList.add('active'); 
        lblT.querySelector('.check-icon').classList.replace('text-muted', 'text-primary');
        lblT.querySelector('.check-icon').classList.remove('opacity-25');
        document.getElementById('transferSection').style.display='block'; 
        document.getElementById('cashSection').style.display='none'; 
        document.getElementById('committeeSelect').required = false;
    } else { 
        lblC.classList.add('active'); 
        lblC.querySelector('.check-icon').classList.replace('text-muted', 'text-primary');
        lblC.querySelector('.check-icon').classList.remove('opacity-25');
        document.getElementById('transferSection').style.display='none'; 
        document.getElementById('cashSection').style.display='block'; 
        document.getElementById('committeeSelect').required = true;
    }
  }

  function convertImg(input) { 
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader(); reader.onload = function(e) {
      const img = new Image(); img.onload = function() {
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        // ย่อขนาดรูปภาพไม่ให้เกิน 800px เพื่อลดภาระฐานข้อมูล
        const MAX_WIDTH = 800; const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        document.getElementById('slipBase64').value = canvas.toDataURL('image/jpeg', 0.6); 
      }; img.src = e.target.result;
    }; reader.readAsDataURL(f); 
  }
  
  async function submitContrib(e) {
    e.preventDefault(); 
    
    const formDataObj = Object.fromEntries(new FormData(e.target));
    
    // ดักจับ: ถ้าเลือกโอนเงิน ต้องมีสลิป
    if (formDataObj.paymentType === 'transfer' && !formDataObj.slipBase64) {
        Swal.fire('แจ้งเตือน', 'กรุณาแนบรูปภาพสลิปโอนเงินครับ', 'warning');
        return;
    }

    const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> กำลังส่งข้อมูล...';
    
    const d = new Date(); const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
    const txIdString = "TX" + Date.now().toString().slice(-8) + Math.floor(Math.random() * 100).toString().padStart(2,'0');
    
    let noteText = "ทำรายการด้วยตนเองผ่านมือถือ";
    if(formDataObj.paymentType === 'cash') noteText = `ฝากเงินสดผ่านกรรมการ: ${formDataObj.committeeName}`;

    // 🌟 โครงสร้างข้อมูลที่เชื่อมกับหน้า Admin (Ledger) ได้ 100%
    const txData = {
        txId: txIdString,
        uid: formDataObj.uid, 
        fullName: formDataObj.fullName, 
        type: "สมทบเงินกองทุน", 
        amount: parseFloat(formDataObj.amount),
        paymentMethod: formDataObj.paymentType === 'transfer' ? "ธนาคาร" : "เงินสด", // คำตรงกับแอดมิน
        status: "รอตรวจสอบ", 
        transactionDate: d.toISOString().split('T')[0], // YYYY-MM-DD สำหรับให้แอดมิน Sort ง่าย
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        note: noteText,
        evidenceUrl: formDataObj.slipBase64 || null // ใช้ชื่อ evidenceUrl เพื่อให้แอดมินเปิดดูสลิปได้เหมือนการเบิกสวัสดิการ
    };

    try {
      await db.collection("transactions").doc(txIdString).set(txData);
      Swal.fire({ title: 'ส่งข้อมูลสำเร็จ!', text: 'กรุณารอแอดมินตรวจสอบยอดเงิน', icon: 'success', confirmButtonColor: '#2563EB' }).then(()=>liff.closeWindow());
    } catch (err) { 
      btn.disabled = false; btn.innerHTML = 'ยืนยันทำรายการ'; 
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
    }
  }
</script>
</body>
</html>
