<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมทบเงินกองทุน | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <style>
    :root { --fintech-primary: #0A2540; --fintech-accent: #3B82F6; --fintech-success: #10B981; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; padding-bottom: 40px; }
    .app-header { background: linear-gradient(135deg, var(--fintech-primary), #1e3a8a); color: white; padding: 30px 20px 50px; text-align: center; border-radius: 0 0 24px 24px; }
    .card-box { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); max-width: 500px; margin: -35px auto 20px; }
    .capsule-contrib { background: linear-gradient(135deg, #10B981, #059669); border-radius: 18px; padding: 20px 24px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    
    .history-card { border: 1px solid #E2E8F0; border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
    .payment-option { border: 2px solid #E2E8F0; border-radius: 16px; padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .payment-option.active { border-color: var(--fintech-accent); background-color: #EFF6FF; }
    .form-check-input { display: none; }
    .form-control, .form-select { border-radius: 12px; padding: 14px; font-weight: 600; border: 1px solid #CBD5E1; }
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; width: 100%; border: none; }
  </style>
</head>
<body>

<div class="app-header">
  <div class="d-flex align-items-center mb-3">
    <button onclick="liff.closeWindow()" class="btn btn-sm btn-outline-light rounded-circle px-2 border-0"><i class="fa-solid fa-arrow-left"></i></button>
    <h5 class="fw-bold mb-0 ms-2">สมทบเงินกองทุน</h5>
  </div>
</div>

<div class="container mb-5">
  <div class="card-box">
    <div class="capsule-contrib text-start">
      <div>
        <small class="opacity-90 fw-bold">ยอดสมทบสะสมทั้งหมด</small>
        <h3 class="fw-bold mb-0 text-white"><span id="dashTotalContrib">0</span> ฿</h3>
      </div>
      <div class="text-end">
        <small class="opacity-90 fw-bold d-block">สมทบแล้ว</small>
        <h4 class="fw-bold mb-0 text-white"><span id="dashMonths">0</span> ด.</h4>
      </div>
    </div>
    <div class="text-danger fw-bold small mb-4 ms-2"><i class="fa-solid fa-circle-exclamation"></i> ยอดค้างชำระปีนี้: <span id="debtText">0</span> ฿</div>
    
    <form id="contribForm" onsubmit="submitContrib(event)">
      <input type="hidden" id="uid" name="uid"> 
      <input type="hidden" id="fullName" name="fullName">
      
      <div class="mb-3"><input type="number" id="amount" name="amount" class="form-control text-primary fs-5" placeholder="จำนวนเงินสมทบ (บาท)" required></div>
      
      <label class="payment-option" id="lblTransfer">
        <input class="form-check-input" type="radio" name="paymentType" value="transfer" onchange="togglePaymentSection()" required>
        <div class="fw-bold text-dark"><i class="fa-solid fa-money-bill-transfer text-primary me-2"></i>โอนเงิน (แนบสลิป)</div>
      </label>
      <label class="payment-option" id="lblCash">
        <input class="form-check-input" type="radio" name="paymentType" value="cash" onchange="togglePaymentSection()">
        <div class="fw-bold text-dark"><i class="fa-solid fa-hand-holding-dollar text-warning me-2"></i>เงินสดผ่านกรรมการ</div>
      </label>
      
      <div id="transferSection" style="display:none;" class="mb-3 p-3 bg-light rounded-4 border">
        <input type="file" class="form-control" id="slipFile" accept="image/*" onchange="convertImg(this)">
        <input type="hidden" id="slipBase64" name="slipBase64">
      </div>

      <div id="cashSection" style="display:none;" class="mb-3 p-3 bg-light rounded-4 border">
        <select class="form-select" id="committeeSelect" name="committeeName"><option value="กรรมการศูนย์">กรรมการประจำศูนย์</option></select>
      </div>
      
      <button type="submit" class="btn btn-fintech" id="submitBtn">ยืนยันทำรายการ</button>
    </form>
  </div>

  <div class="card-box mt-3 pt-3">
    <h6 class="fw-bold mb-3"><i class="fa-solid fa-clock-rotate-left me-2 text-muted"></i>ประวัติการสมทบเงิน</h6>
    <div id="historyList"><p class="text-muted small text-center">ไม่มีประวัติ</p></div>
  </div>
</div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyBs1G5k31100g6PeVvU5nUyz0QDB21jHpI", authDomain: "smartwelf-f7d81.firebaseapp.com", projectId: "smartwelf-f7d81", storageBucket: "smartwelf-f7d81.firebasestorage.app", messagingSenderId: "114126831149", appId: "1:114126831149:web:66ea766f6c558b159442a4" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  let annualFee = 365;

  document.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: "2011183541-lPBacDBx" });
    if(liff.isLoggedIn()) {
      const profile = await liff.getProfile(); document.getElementById('uid').value = profile.userId;
      
      // ดึงการตั้งค่า
      const sysSnap = await db.collection("settings").doc("master").get();
      if(sysSnap.exists) annualFee = sysSnap.data().annualFee || 365;

      const docRef = db.collection("members").doc(profile.userId);
      const docSnap = await docRef.get();
      
      if (docSnap.exists) {
          const d = docSnap.data();
          document.getElementById('fullName').value = d.fullName;
          document.getElementById('dashTotalContrib').innerText = (d.totalContribution || 0).toLocaleString();
          
          // คำนวณเดือน (เช่น 365 บาท/ปี = 12 เดือน -> เดือนละ ~30.4 บาท)
          const costPerMonth = annualFee / 12;
          const monthsPaid = Math.floor((d.totalContribution || 0) / costPerMonth);
          document.getElementById('dashMonths').innerText = monthsPaid;
          
          let debt = annualFee - (d.totalContribution || 0);
          document.getElementById('debtText').innerText = debt > 0 ? debt.toLocaleString() : "0";

          // 🌟 โหลดประวัติ
          const txSnap = await db.collection("transactions").where("uid", "==", profile.userId).where("type", "==", "สมทบเงินกองทุน").get();
          let hHtml = "";
          txSnap.forEach(tx => {
             const txD = tx.data();
             const statusColor = txD.status === 'อนุมัติแล้ว' ? 'text-success' : 'text-warning';
             hHtml += `<div class="history-card">
               <div><span class="fw-bold d-block">฿${txD.amount}</span><small class="text-muted" style="font-size:0.7rem;">${txD.dateStr || txD.status}</small></div>
               <span class="fw-bold small ${statusColor}">${txD.status}</span>
             </div>`;
          });
          if(hHtml) document.getElementById('historyList').innerHTML = hHtml;
      }
    } else liff.login();
  });

  function togglePaymentSection() {
    const pType = document.querySelector('input[name="paymentType"]:checked').value;
    document.getElementById('lblTransfer').classList.remove('active'); document.getElementById('lblCash').classList.remove('active');
    if (pType === 'transfer') { document.getElementById('lblTransfer').classList.add('active'); document.getElementById('transferSection').style.display='block'; document.getElementById('cashSection').style.display='none'; }
    else { document.getElementById('lblCash').classList.add('active'); document.getElementById('transferSection').style.display='none'; document.getElementById('cashSection').style.display='block'; }
  }

  function convertImg(input) { 
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader(); reader.onload = function(e) {
      const img = new Image(); img.onload = function() {
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
        document.getElementById('slipBase64').value = canvas.toDataURL('image/webp', 0.5); 
      }; img.src = e.target.result;
    }; reader.readAsDataURL(f); 
  }
  
  async function submitContrib(e) {
    e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true;
    const formDataObj = Object.fromEntries(new FormData(e.target));
    
    const d = new Date(); const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`;
    const txData = {
        uid: formDataObj.uid, fullName: formDataObj.fullName, type: "สมทบเงินกองทุน", amount: parseFloat(formDataObj.amount),
        paymentMethod: formDataObj.paymentType === 'transfer' ? "โอนเงิน" : "เงินสด",
        slipBase64: formDataObj.slipBase64 || null, status: "รอตรวจสอบ", dateStr: dateStr, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("transactions").add(txData);
      Swal.fire({ title: 'สำเร็จ', text: 'ส่งข้อมูลแล้ว รอตรวจสอบ', icon: 'success' }).then(()=>liff.closeWindow());
    } catch (err) { btn.disabled = false; }
  }
</script>
</body>
</html>
